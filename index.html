<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цирковой сайт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(45deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Анимированные клоуны на фоне */
        .clown-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .flying-clown {
            position: absolute;
            font-size: 3em;
            opacity: 0.7;
            animation: flyAround 20s linear infinite;
        }

        .clown1 { top: 10%; left: 5%; animation-delay: 0s; }
        .clown2 { top: 30%; right: 10%; animation-delay: -5s; animation-duration: 25s; }
        .clown3 { bottom: 20%; left: 15%; animation-delay: -10s; animation-duration: 30s; }
        .clown4 { top: 60%; right: 20%; animation-delay: -15s; }
        .clown5 { bottom: 40%; left: 80%; animation-delay: -8s; animation-duration: 22s; }

        @keyframes flyAround {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(100vw, 50vh) rotate(90deg);
            }
            50% {
                transform: translate(50vw, 100vh) rotate(180deg);
            }
            75% {
                transform: translate(-50vw, 70vh) rotate(270deg);
            }
            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }

        /* Конфетти */
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            background-color: #f0f;
            border-radius: 50%;
            animation: fall 5s linear infinite;
            z-index: -1;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Основной контент */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(231, 76, 60, 0.9);
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.3);
            border: 5px solid #f1c40f;
        }

        h1 {
            font-size: 4em;
            text-shadow: 3px 3px 0 #f1c40f, 6px 6px 0 rgba(0,0,0,0.2);
            margin-bottom: 20px;
            color: #fff;
        }

        .subtitle {
            font-size: 1.5em;
            color: #f1c40f;
            font-style: italic;
        }

        /* Блоки для вашего контента */
        .content-block {
            background: rgba(52, 152, 219, 0.9);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 3px dashed #f1c40f;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .content-block:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(52, 152, 219, 0.4);
        }

        .content-block::before {
            content: 'ОПИСАНИЕ УРОДЦА';
            position: absolute;
            top: -12px;
            left: 20px;
            background: #e74c3c;
            color: white;
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 0.8em;
            border: 2px solid #f1c40f;
        }

        h2 {
            color: #f1c40f;
            font-size: 2.5em;
            margin-bottom: 20px;
            border-bottom: 3px solid #f1c40f;
            padding-bottom: 10px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .user-content {
            min-height: 200px;
            font-size: 1.2em;
            line-height: 1.6;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            border-radius: 10px;
            border: 2px solid #f1c40f;
        }

        /* Специальные стили для разных блоков */
        .block1 { background: rgba(155, 89, 182, 0.9); }
        .block2 { background: rgba(46, 204, 113, 0.9); }
        .block3 { background: rgba(230, 126, 34, 0.9); }
        .block4 { background: rgba(241, 196, 15, 0.9); color: #2c3e50; }
        
        .block4 h2 { color: #e74c3c; border-color: #e74c3c; }

        /* Галерея */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 3px solid #f1c40f;
            transition: all 0.3s;
        }

        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(241, 196, 15, 0.3);
        }

        .gallery-item img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
            border: 2px solid #3498db;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: rgba(44, 62, 80, 0.9);
            border-radius: 15px;
            margin-top: 50px;
            border-top: 5px solid #f1c40f;
        }

        /* Анимация мигания для привлечения внимания */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .edit-notice {
            animation: blink 2s infinite;
            color: #f1c40f;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            background: rgba(231, 76, 60, 0.2);
            border-radius: 10px;
            margin: 20px 0;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            .subtitle { font-size: 1.2em; }
            .content-block { padding: 20px; }
            h2 { font-size: 2em; }
        }
    </style>
</head>
<body>
    <!-- Анимированные клоуны на фоне -->
    <div class="clown-bg">
        <div class="flying-clown clown1">🤡</div>
        <div class="flying-clown clown2">🎪</div>
        <div class="flying-clown clown3">🤹</div>
        <div class="flying-clown clown4">🎭</div>
        <div class="flying-clown clown5">🃏</div>
    </div>

    <!-- Конфетти -->
    <div id="confetti-container"></div>

    <div class="container">
        <header>
            <h1>Сайт переехал</h1>
            <p class="subtitle">Новый сайт: dolbaweek.github.io</p>
        </header>
